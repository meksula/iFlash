spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: rates-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/quotation/{ticker}/price,/api/v1/quotation/{ticker}/quotes
            - id: matching-engine-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/orderbook/{ticker}
            - id: trading-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/trade/order
            - id: instrument-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/instrument
            - id: broker-management-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/broker