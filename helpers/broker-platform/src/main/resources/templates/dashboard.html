<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments :: header}"></nav>

<main class="container">
    <div th:replace="~{fragments :: flash}"></div>

    <section class="hero">
        <div>
            <h1>Welcome back</h1>
            <p class="muted" th:text="${currentEmail}">user</p>
        </div>
        <div class="balance-card">
            <span class="label">Cash balance</span>
            <span class="value" th:text="'$' + ${#numbers.formatDecimal(balance, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
            <a th:href="@{/wallet}" class="btn btn-primary">Add funds</a>
        </div>
    </section>

    <section class="card">
        <div class="card-head">
            <h2>Favorites</h2>
            <a th:href="@{/instruments}" class="btn btn-ghost">Browse instruments</a>
        </div>

        <p class="empty" th:if="${#lists.isEmpty(favorites)}">
            No favorites yet. Add some from the <a th:href="@{/instruments}">instruments</a> list.
        </p>

        <table class="table" th:unless="${#lists.isEmpty(favorites)}">
            <thead>
            <tr><th>Ticker</th><th class="num">Price</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="fav : ${favorites}">
                <td class="mono" th:text="${fav.ticker}">AAA</td>
                <td class="num mono" th:attr="data-price-ticker=${fav.ticker}"
                    th:text="${fav.currentPrice != null} ? '$' + ${#numbers.formatDecimal(fav.currentPrice, 1, 'COMMA', 4, 'POINT')} : '—'">—</td>
                <td class="num">
                    <a th:href="@{'/instruments/' + ${fav.ticker}}" class="btn btn-small">Trade</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
