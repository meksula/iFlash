<div class="login-body">
  <main class="login-card">
    <img class="login-logo" src="ibp-logo.png" alt="iFlash Broker Platform (iBP)" />
    <p class="login-tagline">Trade the iFlash markets — sign in or create your account instantly.</p>

    @if (error()) {
      <div class="flash flash-err">{{ error() }}</div>
    }

    <form class="login-form" (submit)="submit($event)">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" autofocus
             [value]="email()" (input)="email.set($any($event.target).value)" />
      <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
        {{ busy() ? 'Signing in…' : 'Continue' }}
      </button>
    </form>
    <p class="login-note">No password needed. First time? Your account is created with a $0.00 balance.</p>
  </main>
</div>
